aid: knowify
name: Knowify
description: >-
  Knowify is a New York-based construction management SaaS for trade
  contractors (electrical, plumbing, HVAC, painting, remodeling, concrete,
  excavation), covering the full job lifecycle from bidding through payment
  on a single platform. The product spans project execution (estimating,
  proposals and contracts, change orders, RFIs and submittals, scheduling,
  daily logs, document and photo management), service work (dispatch,
  invoicing, payments, field operations, asset and inventory management),
  and financial management (AIA billing, job costing, prevailing wage,
  purchase orders, expenses, WIP and reporting). Knowify is positioned as
  the official construction software partner of QuickBooks Online and offers
  deep two-way sync with QuickBooks Online, QuickBooks Desktop, Intuit
  Enterprise Suite, QuickBooks Payroll, QuickBooks Payments, and QuickBooks
  Time, alongside native integrations with CompanyCam, Billd, Lumber,
  eBacon, and AIA Contract Documents. Third-party automation is available
  via Zapier. Pricing starts at $99/month (Core), $249/month (Advanced),
  and custom Enterprise, with paid add-ons for Service Pro, Live Equipment
  Tracking (FleetSharp), AI Dashcams, and Tool Tracking. Knowify does not
  publish a public REST API, webhooks specification, SDK, CLI, or developer
  portal; programmatic access for third parties is limited to Zapier and
  the QuickBooks ecosystem.
